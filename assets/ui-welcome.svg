<svg viewBox="0 0 380 760" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <clipPath id="frame-clip"><rect x="0" y="0" width="380" height="760" rx="34"/></clipPath>
    <linearGradient id="cam-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f28"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="380" height="760" rx="34" fill="#0a0d12"/>
  <g clip-path="url(#frame-clip)">
  <polygon points="190.0,30.7 213.0,45.374 190.0,59.036 167.0,45.374" fill="#99f6ec"/>
  <polygon points="167.0,45.374 190.0,59.036 190.0,81.3 167.0,67.638" fill="#0d9488"/>
  <polygon points="213.0,45.374 190.0,59.036 190.0,81.3 213.0,67.638" fill="#2dd4bf"/>
  <text x="190.0" y="110" font-size="21" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#e7ecf3" text-anchor="middle">3D Object Scanner</text>
  <text x="190.0" y="136" font-size="12.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="middle">Turn a real object into an interactive</text>
  <text x="190.0" y="153" font-size="12.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="middle">3D model using nothing but your camera.</text>
  <rect x="24" y="190" width="332" height="54" rx="14" fill="#12161d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="48" cy="217.0" r="11" fill="#2dd4bf"/>
  <text x="48" y="221.5" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#062521" text-anchor="middle">1</text>
  <text x="68" y="210" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#e7ecf3" text-anchor="start">Capture</text>
  <text x="68" y="225" font-size="10.8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Take 16–24 photos circling the object.</text>
  <rect x="24" y="254" width="332" height="54" rx="14" fill="#12161d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="48" cy="281.0" r="11" fill="#2dd4bf"/>
  <text x="48" y="285.5" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#062521" text-anchor="middle">2</text>
  <text x="68" y="274" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#e7ecf3" text-anchor="start">Reconstruct</text>
  <text x="68" y="289" font-size="10.8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">We carve a 3D shape from the outlines</text>
  <text x="68" y="302" font-size="10.8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">and color it from your photos.</text>
  <rect x="24" y="318" width="332" height="54" rx="14" fill="#12161d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="48" cy="345.0" r="11" fill="#2dd4bf"/>
  <text x="48" y="349.5" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#062521" text-anchor="middle">3</text>
  <text x="68" y="338" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#e7ecf3" text-anchor="start">View &amp; export</text>
  <text x="68" y="353" font-size="10.8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Rotate it in 3D, then download a real</text>
  <text x="68" y="366" font-size="10.8" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">.obj/.ply file.</text>
  <rect x="24" y="388" width="332" height="108" rx="14" fill="#12161d" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <text x="40" y="410" font-size="12.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#e7ecf3" text-anchor="start">For best results</text>
  <circle cx="44" cy="426" r="1.8" fill="#2dd4bf"/>
  <text x="52" y="430" font-size="10.6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Use a plain, contrasting background</text>
  <circle cx="44" cy="443" r="1.8" fill="#2dd4bf"/>
  <text x="52" y="447" font-size="10.6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Keep the object centered in every shot</text>
  <circle cx="44" cy="460" r="1.8" fill="#2dd4bf"/>
  <text x="52" y="464" font-size="10.6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Space photos evenly around a full circle</text>
  <circle cx="44" cy="477" r="1.8" fill="#2dd4bf"/>
  <text x="52" y="481" font-size="10.6" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="400" fill="#93a0b3" text-anchor="start">Even, soft lighting — avoid harsh shadows</text>
  <rect x="24" y="518" width="332" height="46" rx="23.0" fill="#2dd4bf"/>
  <text x="190.0" y="545.725" font-size="13.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-weight="700" fill="#062521" text-anchor="middle">Start Scanning</text>
  </g>
  <rect x="1.5" y="1.5" width="377" height="757" rx="33" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="3"/>
</svg>